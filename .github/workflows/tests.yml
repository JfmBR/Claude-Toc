name: tests

on:
  push:
  pull_request:

jobs:
  unittest:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Python 3.9 is the minimum. ubuntu-latest (26.04) has no 3.9
        # build in setup-python, so 3.9 runs on ubuntu-24.04.
        include:
          - { os: ubuntu-24.04, python: "3.9" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: windows-latest, python: "3.9" }
          - { os: windows-latest, python: "3.13" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and end-to-end tests
        run: python -m unittest discover -s tests -v
      - name: Launcher finds Python (sh / Git Bash)
        shell: bash
        run: |
          out=$(sh scripts/run.sh status --data-dir "$RUNNER_TEMP/toc")
          echo "$out"
          echo "$out" | grep -q "Claude Toc v"

  validate:
    name: claude plugin validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate plugin and marketplace
        run: npx -y @anthropic-ai/claude-code plugin validate .
